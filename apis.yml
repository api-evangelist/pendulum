aid: pendulum
name: Pendulum
description: >-
  Pendulum (Pendulum Therapeutics, pendulumlife.com) is a microbiome-management
  and metabolic-health company that develops clinically validated probiotic
  supplements built on novel, patented anaerobic microbial strains such as
  Akkermansia muciniphila. Its consumer products - including Glucose Control,
  Metabolic Daily, Akkermansia, and a GLP-1 probiotic - are formulated to fuel
  and maintain the gut lining, support immunity, relieve gas and bloating, and
  help keep blood glucose in a healthy range, differentiated by double-blind,
  placebo-controlled clinical trials rather than off-the-shelf probiotic blends.
  Pendulum is a direct-to-consumer health and supplement brand and is a portfolio
  company of DCVC; it does not currently publish a public developer API surface.
